[package]
name = "rynthv"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "rynthv"

[features]
# Opt-in CPU timing spans; absent from normal editor builds.
synth-profile = []
acoustic-diagnostic = []

[[bin]]
name = "rynthv-synth"
path = "src/synthesis_cli.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu_no_default_features", "accesskit"] }
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg", "file", "image"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4"] }
unicode-segmentation = "=1.13.3"
smallvec = "=1.16.2"
rfd = { version = "=0.17.2", default-features = false }
sha2 = "=0.11.0"
num-bigint = "=0.5.1"
xxhash-rust = { version = "=0.8.19", features = ["xxh3", "xxh32"] }
cpal = "=0.18.2"
symphonia = { version = "=0.6.1", default-features = false, features = ["pcm", "wav", "mp3", "flac", "ogg", "vorbis", "aiff"] }
rayon = "=1.12.0"
blowfish = { version = "=0.10.0", features = ["zeroize"] }
zeroize = { version = "=1.9.1", features = ["alloc"] }
midly = { version = "=0.5.3", default-features = false, features = ["std", "strict"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["x11", "wayland"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "gles"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[build-dependencies]
find-msvc-tools = "=0.1.14"

[profile.release]
lto = "thin"
codegen-units = 1
